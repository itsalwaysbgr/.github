name: PR Checks & Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Application Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f app/api/requirements.txt ]; then pip install -r app/api/requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  iac-validation:
    name: Infrastructure as Code Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  container-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Image Locally
        run: docker build -t pulseops-api:test app/api/

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pulseops-api:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  k8s-lint:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        uses: kubeconform/kubeconform-action@v0.1.0
        with:
          k8sVersion: 1.28.0
          schemaLocations: default
          files: k8s/
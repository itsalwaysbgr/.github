apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseops-ingress
  namespace: pulseops
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: pulseops.staging.internal
      http:
        paths:
          - path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000